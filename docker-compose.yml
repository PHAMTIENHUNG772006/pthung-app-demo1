version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-app
    restart: always
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://book-db:3306/book_management_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1234$
    depends_on:
      - book-db

  book-db:
    image: mysql:8.4
    container_name: book-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234$
      MYSQL_DATABASE: book_management_db
    volumes:
      - book-db-data:/var/lib/mysql

volumes:
  book-db-data: